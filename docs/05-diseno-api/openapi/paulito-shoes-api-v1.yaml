components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT enviado mediante el encabezado Authorization.

        Formato esperado:

        Bearer access-token

    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: |
        Refresh token almacenado en una cookie httpOnly.
        Se utiliza únicamente para renovar o cerrar una sesión.

  parameters:
    Pagina:
      name: pagina
      in: query
      required: false
      description: Número de página solicitada.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    Limite:
      name: limite
      in: query
      required: false
      description: Cantidad máxima de elementos devueltos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    Buscar:
      name: buscar
      in: query
      required: false
      description: Texto utilizado para buscar recursos.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: deportivo

    OrdenPor:
      name: ordenPor
      in: query
      required: false
      description: Propiedad permitida por la cual se ordenarán los resultados.
      schema:
        type: string
      example: fechaCreacion

    Direccion:
      name: direccion
      in: query
      required: false
      description: Dirección utilizada para ordenar los resultados.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      example: desc

    Desde:
      name: desde
      in: query
      required: false
      description: Fecha inicial del período consultado.
      schema:
        type: string
        format: date
      example: "2026-08-01"

    Hasta:
      name: hasta
      in: query
      required: false
      description: Fecha final del período consultado.
      schema:
        type: string
        format: date
      example: "2026-08-31"

    ProductoId:
      name: productoId
      in: path
      required: true
      description: Identificador CUID del producto.
      schema:
        type: string
        minLength: 1
      example: cm123producto456

    VarianteId:
      name: varianteId
      in: path
      required: true
      description: Identificador CUID de la variante.
      schema:
        type: string
        minLength: 1
      example: cm123variante456

    MarcaIdFiltro:
      name: marcaId
      in: query
      required: false
      description: Filtra los productos por marca.
      schema:
        type: string
        minLength: 1
      example: cm123marca456

    CategoriaIdFiltro:
      name: categoriaId
      in: query
      required: false
      description: Filtra los productos por categoría.
      schema:
        type: string
        minLength: 1
      example: cm123categoria456

    TallaFiltro:
      name: talla
      in: query
      required: false
      description: Filtra los productos por talla disponible.
      schema:
        type: integer
        minimum: 1
      example: 40

    ColorFiltro:
      name: color
      in: query
      required: false
      description: Filtra los productos por color.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: negro

    GrupoObjetivoFiltro:
      name: grupoObjetivo
      in: query
      required: false
      description: Filtra los productos por grupo objetivo.
      schema:
        $ref: "#/components/schemas/GrupoObjetivo"
      example: unisex

    PrecioMinFiltro:
      name: precioMin
      in: query
      required: false
      description: Precio mínimo de las variantes mostradas.
      schema:
        type: number
        format: double
        minimum: 0
        multipleOf: 0.01
      example: 20.00

    PrecioMaxFiltro:
      name: precioMax
      in: query
      required: false
      description: Precio máximo de las variantes mostradas.
      schema:
        type: number
        format: double
        minimum: 0
        multipleOf: 0.01
      example: 100.00

    DisponibleFiltro:
      name: disponible
      in: query
      required: false
      description: |
        Filtra los productos según la existencia de al menos
        una variante disponible para compra.
      schema:
        type: boolean
      example: true

    ItemCarritoId:
      name: itemId
      in: path
      required: true
      description: Identificador CUID del elemento del carrito.
      schema:
        type: string
        minLength: 1
      example: cm123item456

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clave única generada por el cliente para evitar la creación
        duplicada de pedidos cuando se repite una solicitud.

        Su implementación podrá aplicarse progresivamente durante el MVP.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 92fdb37c-2f14-46fb-857d-41485d09db77

    PedidoId:
      name: pedidoId
      in: path
      required: true
      description: Identificador CUID del pedido.
      schema:
        type: string
        minLength: 1
      example: cm123pedido456

    EstadoPedidoFiltro:
      name: estado
      in: query
      required: false
      description: Filtra los pedidos por su estado actual.
      schema:
        $ref: "#/components/schemas/EstadoPedido"
      example: pendientePago

    ProductoIdFiltroInventario:
      name: productoId
      in: query
      required: false
      description: Filtra los registros por producto.
      schema:
        type: string
        minLength: 1
      example: cm123producto456

    VarianteIdFiltroInventario:
      name: varianteId
      in: query
      required: false
      description: Filtra los registros por variante.
      schema:
        type: string
        minLength: 1
      example: cm123variante456

    StockMaximoFiltro:
      name: stockMaximo
      in: query
      required: false
      description: |
        Devuelve variantes cuyo stockDisponible sea menor o igual
        al valor indicado.
      schema:
        type: integer
        minimum: 0
        default: 5
      example: 5

    SoloStockBajoFiltro:
      name: soloStockBajo
      in: query
      required: false
      description: Indica si deben mostrarse únicamente variantes con stock bajo.
      schema:
        type: boolean
        default: false
      example: true

    TipoMovimientoFiltro:
      name: tipoMovimiento
      in: query
      required: false
      description: Filtra los movimientos por su tipo.
      schema:
        $ref: "#/components/schemas/TipoMovimientoInventario"
      example: reserva

    ReferenciaMovimientoFiltro:
      name: referenciaTipo
      in: query
      required: false
      description: Filtra los movimientos según su referencia de negocio.
      schema:
        $ref: "#/components/schemas/ReferenciaMovimientoInventario"
      example: pedido

    CategoriaId:
      name: categoriaId
      in: path
      required: true
      description: Identificador CUID de la categoría.
      schema:
        type: string
        minLength: 1
      example: cm123categoria456

    MarcaId:
      name: marcaId
      in: path
      required: true
      description: Identificador CUID de la marca.
      schema:
        type: string
        minLength: 1
      example: cm123marca456

    CambioId:
      name: cambioId
      in: path
      required: true
      description: Identificador CUID de la solicitud de cambio.
      schema:
        type: string
        minLength: 1
      example: cm123cambio456

    UsuarioId:
      name: usuarioId
      in: path
      required: true
      description: Identificador CUID del usuario interno.
      schema:
        type: string
        minLength: 1
      example: cm123usuario456

    MetodoPagoFiltro:
      name: metodoPago
      in: query
      required: false
      description: Filtra los pedidos por método de pago.
      schema:
        $ref: "#/components/schemas/MetodoPago"

    TipoEntregaFiltro:
      name: tipoEntrega
      in: query
      required: false
      description: Filtra los pedidos por tipo de entrega.
      schema:
        $ref: "#/components/schemas/TipoEntrega"

    ClienteIdFiltro:
      name: clienteId
      in: query
      required: false
      description: Filtra los pedidos por cliente.
      schema:
        type: string
        minLength: 1
      example: cm123cliente456

    NumeroPedidoFiltro:
      name: numeroPedido
      in: query
      required: false
      description: Busca un pedido por su número público.
      schema:
        type: string
        minLength: 1
        maxLength: 50
      example: PS-2026-000001

    EstadoCambioFiltro:
      name: estado
      in: query
      required: false
      description: Filtra las solicitudes de cambio por estado.
      schema:
        $ref: "#/components/schemas/EstadoCambioPedido"

    LimiteReporte:
      name: limite
      in: query
      required: false
      description: Cantidad máxima de resultados incluidos en el reporte.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10

    RolUsuarioFiltro:
      name: rol
      in: query
      required: false
      description: Filtra usuarios internos por rol.
      schema:
        type: string
        enum:
          - vendedor
          - admin

    EstadoCuentaFiltro:
      name: estado
      in: query
      required: false
      description: Filtra usuarios por estado de cuenta.
      schema:
        $ref: "#/components/schemas/EstadoCuenta"

  schemas:
    RespuestaSaludGeneral:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
          description: Estado general del servicio.
          example: ok

        service:
          type: string
          description: Nombre del servicio consultado.
          example: Paulito Shoes API

        timestamp:
          type: string
          format: date-time
          description: Fecha y hora de la comprobación en UTC.
          example: "2026-08-07T00:15:00.000Z"

    RespuestaSaludVerificacion:
      type: object
      additionalProperties: false
      required:
        - status
        - check
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
          description: Estado de la comprobación.
          example: ok

        check:
          type: string
          enum:
            - liveness
            - readiness
          description: Tipo de comprobación ejecutada.
          example: liveness

        timestamp:
          type: string
          format: date-time
          description: Fecha y hora de la comprobación en UTC.
          example: "2026-08-07T00:15:00.000Z"

    MetaPaginacion:
      type: object
      additionalProperties: false
      required:
        - pagina
        - limite
        - total
        - totalPaginas
        - tienePaginaAnterior
        - tienePaginaSiguiente
      properties:
        pagina:
          type: integer
          minimum: 1
          description: Página actual.
          example: 1

        limite:
          type: integer
          minimum: 1
          maximum: 100
          description: Cantidad máxima de registros por página.
          example: 20

        total:
          type: integer
          minimum: 0
          description: Cantidad total de registros encontrados.
          example: 48

        totalPaginas:
          type: integer
          minimum: 0
          description: Cantidad total de páginas disponibles.
          example: 3

        tienePaginaAnterior:
          type: boolean
          description: Indica si existe una página anterior.
          example: false

        tienePaginaSiguiente:
          type: boolean
          description: Indica si existe una página siguiente.
          example: true

    DetalleValidacion:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Propiedad que no superó la validación.
          example: cantidad

        message:
          type: string
          description: Descripción del error de validación.
          example: La cantidad debe ser mayor que cero

    RespuestaError:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - error
        - message
        - path
        - timestamp
        - requestId
      properties:
        statusCode:
          type: integer
          description: Código HTTP asociado con el error.
          example: 400

        error:
          type: string
          description: Código interno utilizado para identificar el error.
          example: VALIDATION_ERROR

        message:
          type: string
          description: Descripción general del error.
          example: Los datos enviados no son válidos

        details:
          description: Información adicional relacionada con el error.
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/DetalleValidacion"

            - type: object
              additionalProperties: true

        path:
          type: string
          description: Ruta donde ocurrió el error.
          example: /api/v1/carrito/items

        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error en UTC.
          example: "2026-08-07T00:15:00.000Z"

        requestId:
          type: string
          description: Identificador utilizado para correlacionar la solicitud con los logs.
          example: req_123example456

    RespuestaMensaje:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: Mensaje informativo sobre el resultado de la operación.
          example: Operación realizada correctamente

    RolUsuario:
      type: string
      description: Rol utilizado para autorizar operaciones dentro del sistema.
      enum:
        - cliente
        - vendedor
        - admin
      example: cliente

    RegistroClienteRequest:
      type: object
      additionalProperties: false
      required:
        - nombreCompleto
        - email
        - password
      properties:
        nombreCompleto:
          type: string
          minLength: 3
          maxLength: 120
          description: Nombre completo del cliente.
          example: Juan Pérez

        email:
          type: string
          format: email
          maxLength: 254
          description: Email único utilizado para acceder al sistema.
          example: juan.perez@example.com

        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Contraseña que será protegida mediante bcrypt.
          example: ContrasenaSegura123

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email registrado por el usuario.
          example: juan.perez@example.com

        password:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: Contraseña utilizada para autenticar al usuario.
          example: ContrasenaSegura123

    UsuarioAutenticado:
      type: object
      additionalProperties: false
      required:
        - id
        - nombreCompleto
        - email
        - rol
        - estado
        - creadoEn
      properties:
        id:
          type: string
          description: Identificador CUID del usuario.
          example: cm123cliente456

        nombreCompleto:
          type:
            - string
            - "null"
          maxLength: 120
          description: Nombre completo del usuario.
          example: Juan Pérez

        email:
          type: string
          format: email
          description: Email registrado por el usuario.
          example: juan.perez@example.com

        rol:
          $ref: "#/components/schemas/RolUsuario"

        estado:
          $ref: '#/components/schemas/EstadoCuenta'
        creadoEn:
          type: string
          format: date-time
          description: Fecha de creación de la cuenta en UTC.
          example: "2026-08-07T00:15:00.000Z"

    DatosAutenticacion:
      type: object
      additionalProperties: false
      required:
        - usuario
        - accessToken
        - tokenType
        - expiresIn
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioAutenticado"

        accessToken:
          type: string
          description: Access token JWT de corta duración.
          example: jwt-access-token

        tokenType:
          type: string
          enum:
            - Bearer
          description: Tipo de autenticación utilizado para enviar el token.
          example: Bearer

        expiresIn:
          type: integer
          minimum: 1
          description: Duración del access token expresada en segundos.
          example: 900

    RespuestaAutenticacion:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DatosAutenticacion"

    DatosAccessToken:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: Nuevo access token JWT.
          example: nuevo-jwt-access-token

        tokenType:
          type: string
          enum:
            - Bearer
          description: Tipo de autenticación utilizado.
          example: Bearer

        expiresIn:
          type: integer
          minimum: 1
          description: Duración del nuevo access token expresada en segundos.
          example: 900

    RespuestaAccessToken:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DatosAccessToken"

    RespuestaUsuarioAutenticado:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UsuarioAutenticado"

    RecuperarPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email asociado con la cuenta que se desea recuperar.
          example: juan.perez@example.com

    RestablecerPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - nuevaPassword
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: Token temporal de recuperación recibido por el usuario.
          example: token-temporal-recuperacion

        nuevaPassword:
          type: string
          format: password
          minLength: 8
          writeOnly: true
          description: Nueva contraseña que será protegida mediante bcrypt.
          example: NuevaContrasenaSegura123

    PerfilCliente:
      type: object
      additionalProperties: false
      required:
        - id
        - nombreCompleto
        - email
        - creadoEn
        - actualizadoEn
      properties:
        id:
          type: string
          description: Identificador CUID del cliente.
          example: cm123cliente456

        nombreCompleto:
          type:
            - string
            - "null"
          maxLength: 120
          description: Nombre completo del cliente.
          example: Juan Pérez

        email:
          type: string
          format: email
          description: Email registrado por el cliente.
          example: juan.perez@example.com

        creadoEn:
          type: string
          format: date-time
          description: Fecha de creación del perfil en UTC.
          example: "2026-08-07T00:15:00.000Z"

        actualizadoEn:
          type: string
          format: date-time
          description: Fecha de última actualización en UTC.
          example: "2026-08-07T01:30:00.000Z"

    ActualizarPerfilClienteRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombreCompleto:
          type:
            - string
            - "null"
          minLength: 3
          maxLength: 120
          description: Nuevo nombre completo del cliente.
          example: Juan Carlos Pérez

    RespuestaPerfilCliente:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/PerfilCliente"

    EstadoProducto:
      type: string
      description: Estado actual de un producto.
      enum:
        - borrador
        - activo
        - archivado
      example: activo

    EstadoVarianteProducto:
      type: string
      description: Estado actual de una variante.
      enum:
        - activo
        - inactivo
        - descontinuado
      example: activo

    GrupoObjetivo:
      type: string
      description: Grupo de clientes al que está orientado el producto.
      enum:
        - niño
        - niña
        - hombre
        - mujer
        - unisex
      example: unisex

    EstadoEntidadCatalogo:
      type: string
      description: Estado operativo de una marca o categoría.
      enum:
        - activa
        - inactiva
      example: activa
    MarcaCatalogo:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          description: Identificador CUID de la marca.
          example: cm123marca456

        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre comercial de la marca.
          example: Marca ejemplo

        estado:
          $ref: '#/components/schemas/EstadoEntidadCatalogo'
    CategoriaCatalogo:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          description: Identificador CUID de la categoría.
          example: cm123categoria456

        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre de la categoría.
          example: Deportivos

        descripcion:
          type:
            - string
            - "null"
          maxLength: 500
          description: Descripción de la categoría.
          example: Calzado para actividades deportivas

        estado:
          $ref: '#/components/schemas/EstadoEntidadCatalogo'
    VarianteProductoCatalogo:
      type: object
      additionalProperties: false
      required:
        - id
        - talla
        - color
        - tipoSerie
        - precio
        - stockDisponible
        - disponible
      properties:
        id:
          type: string
          description: Identificador CUID de la variante.
          example: cm123variante456

        productoId:
          type: string
          description: Identificador CUID del producto relacionado.
          example: cm123producto456

        talla:
          type: integer
          minimum: 1
          description: Talla de la variante.
          example: 40

        color:
          type: string
          minLength: 1
          maxLength: 50
          description: Color de la variante.
          example: negro

        tipoSerie:
          type: string
          minLength: 1
          maxLength: 50
          description: Clasificación interna de la serie de tallas.
          example: mediana

        precio:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: Precio actual de la variante en dólares estadounidenses.
          example: 49.99

        stockDisponible:
          type: integer
          minimum: 0
          description: Cantidad disponible para venta.
          example: 5

        disponible:
          type: boolean
          description: |
            Indica si la variante está activa y tiene stock mayor que cero.
          example: true

    ProductoResumenCatalogo:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - descripcion
        - grupoObjetivo
        - estado
        - marca
        - categoria
        - precioDesde
        - disponible
      properties:
        id:
          type: string
          description: Identificador CUID del producto.
          example: cm123producto456

        nombre:
          type: string
          minLength: 1
          maxLength: 150
          description: Nombre comercial del producto.
          example: Zapato deportivo

        descripcion:
          type: string
          minLength: 1
          description: Descripción pública del producto.
          example: Calzado deportivo para uso diario

        grupoObjetivo:
          $ref: "#/components/schemas/GrupoObjetivo"

        estado:
          $ref: "#/components/schemas/EstadoProducto"

        marca:
          $ref: "#/components/schemas/MarcaCatalogo"

        categoria:
          $ref: "#/components/schemas/CategoriaCatalogo"

        precioDesde:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: Menor precio entre las variantes públicas del producto.
          example: 49.99

        disponible:
          type: boolean
          description: |
            Indica si el producto tiene al menos una variante disponible.
          example: true

    ProductoDetalleCatalogo:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - descripcion
        - grupoObjetivo
        - estado
        - marca
        - categoria
        - variantes
      properties:
        id:
          type: string
          description: Identificador CUID del producto.
          example: cm123producto456

        nombre:
          type: string
          minLength: 1
          maxLength: 150
          description: Nombre comercial del producto.
          example: Zapato deportivo

        descripcion:
          type: string
          minLength: 1
          description: Descripción pública del producto.
          example: Calzado deportivo para uso diario

        grupoObjetivo:
          $ref: "#/components/schemas/GrupoObjetivo"

        estado:
          $ref: "#/components/schemas/EstadoProducto"

        notaPrecioBase:
          type:
            - string
            - "null"
          description: Nota informativa relacionada con el precio base.
          example: null

        marca:
          $ref: "#/components/schemas/MarcaCatalogo"

        categoria:
          $ref: "#/components/schemas/CategoriaCatalogo"

        variantes:
          type: array
          items:
            $ref: "#/components/schemas/VarianteProductoCatalogo"

    RespuestaListaProductos:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductoResumenCatalogo"

        meta:
          $ref: "#/components/schemas/MetaPaginacion"

    RespuestaProductoDetalle:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ProductoDetalleCatalogo"

    RespuestaListaVariantes:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VarianteProductoCatalogo"

    RespuestaVarianteProducto:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/VarianteProductoCatalogo"

    RespuestaListaCategorias:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaCatalogo"

    RespuestaListaMarcas:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MarcaCatalogo"

    EstadoCarrito:
      type: string

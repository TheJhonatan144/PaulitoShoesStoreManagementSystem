      tags:
        - Administración
      summary: Confirmar manualmente un pago por transferencia
      description: |
        Confirma el pago de un pedido realizado mediante transferencia.

        El pedido deberá encontrarse en estado pendientePago.

        Antes de confirmar, el backend volverá a validar el inventario.
        Si existe stock suficiente, se crearán movimientos salidaVenta
        y el pedido pasará a pagadoConfirmado.
      operationId: confirmarPagoTransferencia
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/PedidoId"
        - $ref: "#/components/parameters/IdempotencyKey"

      requestBody:

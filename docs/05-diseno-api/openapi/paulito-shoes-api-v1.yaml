              schema:
                $ref: "#/components/schemas/RespuestaInteresStockCliente"
              example:
                data:
                  id: cm123interes456
                  variante:
                    id: cm123variante456
                    productoId: cm123producto456
                    nombreProducto: Zapato deportivo
                    talla: 40
                    color: negro
                    codigoInterno: ZAP-DEP-40-NEG
                    stockDisponible: 0
                    disponible: false
                  fechaCreacion: "2026-08-07T00:15:00.000Z"
                message: Interés de stock registrado correctamente

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          description: La variante solicitada no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 404
                error: VARIANT_NOT_FOUND
                message: La variante solicitada no existe
                path: /api/v1/variantes/cm123variante456/intereses-stock
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "409":
          description: El cliente ya registró interés por la variante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 409
                error: INTEREST_ALREADY_REGISTERED
                message: El interés por esta variante ya fue registrado
                path: /api/v1/variantes/cm123variante456/intereses-stock
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "422":
          description: La variante no admite el registro de interés.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                varianteDisponible:
                  summary: La variante tiene stock
                  value:
                    statusCode: 422
                    error: VARIANT_HAS_STOCK
                    message: La variante se encuentra disponible para compra
                    path: /api/v1/variantes/cm123variante456/intereses-stock
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

                varianteInactiva:
                  summary: La variante no está habilitada
                  value:
                    statusCode: 422
                    error: VARIANT_NOT_AVAILABLE
                    message: La variante no está disponible para registrar interés
                    path: /api/v1/variantes/cm123variante456/intereses-stock
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Intereses de stock
      summary: Retirar el interés registrado por una variante
      description: |
        Elimina el interés del cliente autenticado sobre una variante.


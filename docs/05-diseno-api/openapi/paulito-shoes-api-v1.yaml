        subtotalLinea:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: Subtotal estimado para el elemento del carrito.
          example: 99.98

        creadoEn:
          type: string
          format: date-time
          description: Fecha de creación del elemento.
          example: "2026-08-07T00:15:00.000Z"

        actualizadoEn:
          type: string
          format: date-time
          description: Fecha de última actualización del elemento.
          example: "2026-08-07T00:15:00.000Z"

    DireccionEntrega:
      type: object
      additionalProperties: false
      required:
        - id
        - nombreCompleto
        - telefono
        - provincia
        - ciudad
        - direccionLinea1

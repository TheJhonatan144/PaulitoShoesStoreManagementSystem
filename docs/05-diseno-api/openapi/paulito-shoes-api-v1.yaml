      description: Método de pago seleccionado para el pedido.
      enum:
        - transferencia
        - contraEntrega
      example: transferencia

    TipoEntrega:
      type: string
      description: Forma seleccionada para recibir el pedido.
      enum:
        - domicilio
        - retiroEnTienda
      example: domicilio

    EstadoPedido:
      type: string
      description: Estado actual del pedido.
      enum:
        - pendientePago
        - reservado
        - pagadoConfirmado
        - preparado
        - enviado
        - entregado
        - cancelado
        - noEntregado
        - canceladoAutomatico
      example: pendientePago

    VarianteCarritoResumen:
      type: object
      additionalProperties: false
      required:
        - id
        - productoId
        - nombreProducto
        - talla
        - color
        - stockDisponible
        - disponible
      properties:
        id:
          type: string
          description: Identificador CUID de la variante.
          example: cm123variante456

        productoId:
          type: string
          description: Identificador CUID del producto.
          example: cm123producto456

        nombreProducto:
          type: string
          description: Nombre actual del producto.
          example: Zapato deportivo

        talla:
          type: integer
          minimum: 1
          description: Talla seleccionada.
          example: 40

        color:
          type: string
          description: Color de la variante.
          example: negro

        stockDisponible:
          type: integer
          minimum: 0
          description: Stock disponible al momento de consultar el carrito.
          example: 5

        disponible:
          type: boolean
          description: Indica si la variante puede continuar en el proceso de compra.
          example: true

    CarritoItem:
      type: object
      additionalProperties: false
      required:
        - id
        - variante
        - cantidad
        - precioUnitarioRegistrado
        - subtotalLinea
        - creadoEn
        - actualizadoEn
      properties:
        id:
          type: string
          description: Identificador CUID del elemento del carrito.
          example: cm123item456

        variante:
          $ref: "#/components/schemas/VarianteCarritoResumen"

        cantidad:
          type: integer
          minimum: 1
          description: Cantidad solicitada.
          example: 2

        precioUnitarioRegistrado:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: Precio registrado cuando la variante fue agregada al carrito.

openapi: 3.1.0

info:
  title: Paulito Shoes Store API
  version: 1.0.0
  description: |
    API REST del sistema Paulito Shoes Store Management System.

    Esta especificación define el contrato inicial para los módulos de
    autenticación, clientes, catálogo, carrito, checkout, pedidos,
    inventario, intereses de stock y administración.

    La API está diseñada para un e-commerce de calzado con productos
    organizados por variantes de talla y color, control de inventario,
    pagos mediante transferencia y contraentrega, y gestión administrativa.

servers:
  - url: http://localhost:3000
    description: Entorno local de desarrollo

tags:
  - name: Salud
    description: Comprobaciones técnicas de disponibilidad de la API.

  - name: Autenticación
    description: Registro, inicio de sesión, renovación y cierre de sesión.

  - name: Clientes
    description: Gestión del perfil y recursos propios del cliente.

  - name: Catálogo
    description: Productos, variantes, categorías y marcas.

  - name: Carrito
    description: Gestión del carrito activo del cliente.

  - name: Checkout
    description: Validación y confirmación del proceso de compra.

  - name: Pedidos
    description: Consulta, seguimiento y gestión de pedidos.

  - name: Inventario
    description: Stock, reservas, liberaciones y movimientos de inventario.

  - name: Intereses de stock
    description: Intereses registrados sobre variantes sin disponibilidad.

  - name: Administración
    description: Operaciones internas para administradores y vendedores.

  - name: Reportes
    description: Consultas administrativas y reportes comerciales.

paths:
  /health:
    get:
      tags:
        - Salud
      summary: Consultar el estado general de la API
      description: |
        Comprueba que la aplicación se encuentra disponible y que puede
        establecer comunicación con la base de datos.
      operationId: obtenerEstadoGeneral
      responses:
        "200":
          description: La API y la base de datos se encuentran disponibles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSaludGeneral"
              example:
                status: ok
                service: Paulito Shoes API
                timestamp: "2026-08-07T00:15:00.000Z"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /health/live:
    get:
      tags:
        - Salud
      summary: Comprobar que el proceso de la API está vivo
      description: |
        Comprueba que el proceso de la aplicación está ejecutándose.
        No realiza una consulta a la base de datos.
      operationId: comprobarLiveness
      responses:
        "200":
          description: El proceso de la aplicación se encuentra activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSaludVerificacion"
              example:
                status: ok
                check: liveness
                timestamp: "2026-08-07T00:15:00.000Z"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /health/ready:
    get:
      tags:
        - Salud
      summary: Comprobar que la API está preparada para recibir tráfico
      description: |
        Comprueba que la aplicación está ejecutándose y que puede
        establecer comunicación con la base de datos.
      operationId: comprobarReadiness
      responses:
        "200":
          description: La aplicación se encuentra preparada para recibir tráfico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaSaludVerificacion"
              example:
                status: ok
                check: readiness
                timestamp: "2026-08-07T00:15:00.000Z"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/registro:
    post:
      tags:
        - Autenticación
      summary: Registrar un nuevo cliente
      description: |
        Crea una cuenta de cliente dentro del sistema.

        El registro público siempre asignará el rol cliente.
        Los roles vendedor y admin no podrán solicitarse desde este endpoint.

        Después del registro exitoso, la API devolverá un access token
        y enviará el refresh token mediante una cookie httpOnly.
      operationId: registrarCliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistroClienteRequest"
            example:
              nombreCompleto: Juan Pérez
              email: juan.perez@example.com
              password: ContrasenaSegura123

      responses:
        "201":
          description: Cliente registrado y autenticado correctamente.
          headers:
            Set-Cookie:
              description: |
                Cookie httpOnly que contiene el refresh token.
                En producción también deberá utilizar el atributo Secure.
              schema:
                type: string
                example: refreshToken=jwt-refresh-token; HttpOnly; Path=/api/v1/auth; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaAutenticacion"
              example:
                data:
                  usuario:
                    id: cm123cliente456
                    nombreCompleto: Juan Pérez
                    email: juan.perez@example.com
                    rol: cliente
                    estado: activa
                    creadoEn: "2026-08-07T00:15:00.000Z"
                  accessToken: jwt-access-token
                  tokenType: Bearer
                  expiresIn: 900

        "400":
          $ref: "#/components/responses/BadRequest"

        "409":
          description: Ya existe una cuenta registrada con el email enviado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 409
                error: EMAIL_ALREADY_EXISTS
                message: Ya existe una cuenta registrada con este email
                path: /api/v1/auth/registro
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "429":
          $ref: "#/components/responses/TooManyRequests"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Valida las credenciales del usuario y genera una nueva sesión.

        La respuesta devolverá un access token y enviará el refresh token
        mediante una cookie httpOnly.

        La respuesta de error no revelará si el email existe o si únicamente
        la contraseña es incorrecta.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: juan.perez@example.com
              password: ContrasenaSegura123

      responses:
        "200":
          description: Sesión iniciada correctamente.
          headers:
            Set-Cookie:
              description: |
                Cookie httpOnly que contiene el refresh token.
                En producción también deberá utilizar el atributo Secure.
              schema:
                type: string
                example: refreshToken=jwt-refresh-token; HttpOnly; Path=/api/v1/auth; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaAutenticacion"
              example:
                data:
                  usuario:
                    id: cm123cliente456
                    nombreCompleto: Juan Pérez
                    email: juan.perez@example.com
                    rol: cliente
                    estado: activa
                    creadoEn: "2026-08-07T00:15:00.000Z"
                  accessToken: jwt-access-token
                  tokenType: Bearer
                  expiresIn: 900

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          description: Las credenciales enviadas no son correctas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 401
                error: INVALID_CREDENTIALS
                message: Email o contraseña incorrectos
                path: /api/v1/auth/login
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "429":
          $ref: "#/components/responses/TooManyRequests"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renovar el access token
      description: |
        Genera un nuevo access token utilizando el refresh token enviado
        automáticamente mediante una cookie httpOnly.

        El refresh token no deberá enviarse dentro del cuerpo de la solicitud.

        La operación podrá rotar el refresh token y reemplazar la cookie actual.
      operationId: renovarAccessToken
      security:
        - refreshCookie: []

      responses:
        "200":
          description: Access token renovado correctamente.
          headers:
            Set-Cookie:
              description: |
                Nueva cookie httpOnly cuando se aplique rotación
                del refresh token.
              schema:
                type: string
                example: refreshToken=nuevo-jwt-refresh-token; HttpOnly; Path=/api/v1/auth; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaAccessToken"
              example:
                data:
                  accessToken: nuevo-jwt-access-token
                  tokenType: Bearer
                  expiresIn: 900

        "401":
          description: El refresh token no existe, expiró o fue revocado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                tokenInvalido:
                  summary: Refresh token inválido
                  value:
                    statusCode: 401
                    error: INVALID_TOKEN
                    message: El refresh token no es válido
                    path: /api/v1/auth/refresh
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

                sesionRevocada:
                  summary: Sesión revocada
                  value:
                    statusCode: 401
                    error: SESSION_REVOKED
                    message: La sesión fue revocada
                    path: /api/v1/auth/refresh
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

        "429":
          $ref: "#/components/responses/TooManyRequests"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar la sesión actual
      description: |
        Revoca la sesión asociada con el refresh token y elimina
        la cookie de autenticación.

        La operación es idempotente. Repetir la solicitud no deberá
        crear efectos adicionales después del primer cierre exitoso.
      operationId: cerrarSesion
      security:
        - refreshCookie: []
        - {}
      responses:
        "204":
          description: |
            Sesión cerrada correctamente.

            La respuesta no contiene cuerpo y elimina la cookie
            utilizada para almacenar el refresh token.
          headers:
            Set-Cookie:
              description: Cookie de refresh token eliminada.
              schema:
                type: string
                example: refreshToken=; HttpOnly; Path=/api/v1/auth; Max-Age=0; SameSite=Lax

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/me:
    get:
      tags:
        - Autenticación
      summary: Consultar el usuario autenticado
      description: |
        Devuelve la información pública del usuario asociado
        con el access token enviado en el encabezado Authorization.
      operationId: obtenerUsuarioAutenticado
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Información pública del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuarioAutenticado"
              example:
                data:
                  id: cm123cliente456
                  nombreCompleto: Juan Pérez
                  email: juan.perez@example.com
                  rol: cliente
                  estado: activa
                  creadoEn: "2026-08-07T00:15:00.000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          description: La cuenta se encuentra bloqueada o desactivada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 403
                error: ACCOUNT_DISABLED
                message: La cuenta no está habilitada para acceder al sistema
                path: /api/v1/auth/me
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/recuperar-password:
    post:
      tags:
        - Autenticación
      summary: Solicitar recuperación de contraseña
      description: |
        Inicia el proceso de recuperación de contraseña.

        La respuesta será siempre genérica y no confirmará si existe
        una cuenta asociada con el email enviado. Esto evita facilitar
        la enumeración de usuarios registrados.
      operationId: solicitarRecuperacionPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecuperarPasswordRequest"
            example:
              email: juan.perez@example.com

      responses:
        "200":
          description: Solicitud procesada sin revelar la existencia de la cuenta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMensaje"
              example:
                message: Si existe una cuenta asociada, se enviarán las instrucciones correspondientes

        "400":
          $ref: "#/components/responses/BadRequest"

        "429":
          $ref: "#/components/responses/TooManyRequests"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/restablecer-password:
    post:
      tags:
        - Autenticación
      summary: Restablecer la contraseña
      description: |
        Establece una nueva contraseña utilizando un token temporal,
        de un solo uso y con duración limitada.

        Después de restablecer la contraseña, el sistema deberá invalidar
        el token temporal y podrá revocar las sesiones activas del usuario.
      operationId: restablecerPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestablecerPasswordRequest"
            example:
              token: token-temporal-recuperacion
              nuevaPassword: NuevaContrasenaSegura123

      responses:
        "200":
          description: Contraseña restablecida correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaMensaje"
              example:
                message: La contraseña fue restablecida correctamente

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          description: El token de recuperación no es válido o expiró.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 401
                error: PASSWORD_RESET_TOKEN_INVALID
                message: El token de recuperación no es válido o ha expirado
                path: /api/v1/auth/restablecer-password
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "429":
          $ref: "#/components/responses/TooManyRequests"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/clientes/me:
    get:
      tags:
        - Clientes
      summary: Consultar el perfil del cliente autenticado
      description: |
        Devuelve la información pública del perfil asociado con el
        cliente autenticado.

        El cliente únicamente podrá consultar su propio perfil.
      operationId: obtenerPerfilCliente
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Perfil del cliente obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaPerfilCliente"
              example:
                data:
                  id: cm123cliente456
                  nombreCompleto: Juan Pérez
                  email: juan.perez@example.com
                  creadoEn: "2026-08-07T00:15:00.000Z"
                  actualizadoEn: "2026-08-07T01:30:00.000Z"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - Clientes
      summary: Actualizar el perfil del cliente autenticado
      description: |
        Actualiza parcialmente los datos públicos del perfil.

        El cliente únicamente podrá modificar su propio perfil.
        El email no se actualizará desde este endpoint durante el MVP.
      operationId: actualizarPerfilCliente
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarPerfilClienteRequest"
            example:
              nombreCompleto: Juan Carlos Pérez

      responses:
        "200":
          description: Perfil actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaPerfilCliente"
              example:
                data:
                  id: cm123cliente456
                  nombreCompleto: Juan Carlos Pérez
                  email: juan.perez@example.com
                  creadoEn: "2026-08-07T00:15:00.000Z"
                  actualizadoEn: "2026-08-07T01:45:00.000Z"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/productos:
    get:
      tags:
        - Catálogo
      summary: Listar productos del catálogo público
      description: |
        Devuelve los productos disponibles dentro del catálogo público.

        Solo se mostrarán productos activos. Los productos en estado
        borrador o archivado no serán visibles para el público.

        La consulta permite aplicar búsqueda, paginación, filtros
        y ordenamiento.
      operationId: listarProductosCatalogo
      security: []

      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Buscar"
        - $ref: "#/components/parameters/OrdenPor"
        - $ref: "#/components/parameters/Direccion"
        - $ref: "#/components/parameters/MarcaIdFiltro"
        - $ref: "#/components/parameters/CategoriaIdFiltro"
        - $ref: "#/components/parameters/TallaFiltro"
        - $ref: "#/components/parameters/ColorFiltro"
        - $ref: "#/components/parameters/GrupoObjetivoFiltro"
        - $ref: "#/components/parameters/PrecioMinFiltro"
        - $ref: "#/components/parameters/PrecioMaxFiltro"
        - $ref: "#/components/parameters/DisponibleFiltro"

      responses:
        "200":
          description: Productos obtenidos correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaListaProductos"
              example:
                data:
                  - id: cm123producto456
                    nombre: Zapato deportivo
                    descripcion: Calzado deportivo para uso diario
                    grupoObjetivo: unisex
                    estado: activo
                    marca:
                      id: cm123marca456
                      nombre: Marca ejemplo
                    categoria:
                      id: cm123categoria456
                      nombre: Deportivos
                    precioDesde: 49.99
                    disponible: true
                meta:
                  pagina: 1
                  limite: 20
                  total: 48
                  totalPaginas: 3
                  tienePaginaAnterior: false
                  tienePaginaSiguiente: true

        "400":
          $ref: "#/components/responses/BadRequest"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/productos/{productoId}:
    get:
      tags:
        - Catálogo
      summary: Consultar el detalle de un producto
      description: |
        Devuelve la información pública de un producto activo,
        incluyendo sus variantes disponibles y no disponibles.

        Las variantes sin stock podrán mostrarse con disponible en false
        para que el cliente consulte otras tallas o registre interés.
      operationId: obtenerDetalleProducto
      security: []

      parameters:
        - $ref: "#/components/parameters/ProductoId"

      responses:
        "200":
          description: Producto obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaProductoDetalle"
              example:
                data:
                  id: cm123producto456
                  nombre: Zapato deportivo
                  descripcion: Calzado deportivo para uso diario
                  grupoObjetivo: unisex
                  estado: activo
                  notaPrecioBase: null
                  marca:
                    id: cm123marca456
                    nombre: Marca ejemplo
                  categoria:
                    id: cm123categoria456
                    nombre: Deportivos
                  variantes:
                    - id: cm123variante456
                      talla: 40
                      color: negro
                      tipoSerie: mediana
                      precio: 49.99
                      stockDisponible: 5
                      disponible: true
                    - id: cm789variante012
                      talla: 41
                      color: negro
                      tipoSerie: mediana
                      precio: 49.99
                      stockDisponible: 0
                      disponible: false

        "404":
          description: El producto no existe o no está disponible públicamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 404
                error: PRODUCT_NOT_FOUND
                message: El producto solicitado no existe
                path: /api/v1/productos/cm123producto456
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/productos/{productoId}/variantes:
    get:
      tags:
        - Catálogo
      summary: Consultar las variantes de un producto
      description: |
        Devuelve las variantes públicas pertenecientes a un producto.

        Cada variante representa una combinación de talla y color.
        Las variantes inactivas o descontinuadas no estarán disponibles
        para compra.
      operationId: listarVariantesProducto
      security: []

      parameters:
        - $ref: "#/components/parameters/ProductoId"

      responses:
        "200":
          description: Variantes obtenidas correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaListaVariantes"
              example:
                data:
                  - id: cm123variante456
                    talla: 40
                    color: negro
                    tipoSerie: mediana
                    precio: 49.99
                    stockDisponible: 5
                    disponible: true
                  - id: cm789variante012
                    talla: 41
                    color: negro
                    tipoSerie: mediana
                    precio: 49.99
                    stockDisponible: 0
                    disponible: false

        "404":
          description: El producto solicitado no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 404
                error: PRODUCT_NOT_FOUND
                message: El producto solicitado no existe
                path: /api/v1/productos/cm123producto456/variantes
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/variantes/{varianteId}:
    get:
      tags:
        - Catálogo
      summary: Consultar una variante específica
      description: |
        Devuelve la información pública de una variante de producto.

        Una variante con stock igual a cero podrá consultarse,
        pero no podrá agregarse al carrito.
      operationId: obtenerVarianteProducto
      security: []

      parameters:
        - $ref: "#/components/parameters/VarianteId"

      responses:
        "200":
          description: Variante obtenida correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaVarianteProducto"
              example:
                data:
                  id: cm123variante456
                  productoId: cm123producto456
                  talla: 40
                  color: negro
                  tipoSerie: mediana
                  precio: 49.99
                  stockDisponible: 5
                  disponible: true

        "404":
          description: La variante solicitada no existe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 404
                error: VARIANT_NOT_FOUND
                message: La variante solicitada no existe
                path: /api/v1/variantes/cm123variante456
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "500":

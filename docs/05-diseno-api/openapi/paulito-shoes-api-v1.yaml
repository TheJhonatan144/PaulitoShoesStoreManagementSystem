      summary: Registrar el comprobante de una transferencia
      description: |
        Registra el código de transferencia asociado con un pedido
        perteneciente al cliente autenticado.

        Esta operación solo estará disponible para pedidos cuyo método
        de pago sea transferencia y que se encuentren en estado pendientePago.

        El registro del código no confirma automáticamente el pago.
        La confirmación será realizada posteriormente por un vendedor
        o administrador autorizado.

        El modelo inicial contempla únicamente codigoTransferencia.
        El almacenamiento de imágenes requerirá ampliar el modelo
        e integrar el servicio de archivos correspondiente.
      operationId: registrarComprobanteTransferencia
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/PedidoId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComprobanteTransferenciaRequest"
            example:
              codigoTransferencia: TRX-123456

      responses:
        "200":
          description: Código de transferencia registrado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaComprobanteTransferencia"
              example:
                data:
                  pedidoId: cm123pedido456
                  numeroPedido: PS-2026-000001
                  estado: pendientePago
                  metodoPago: transferencia
                  codigoTransferencia: TRX-123456
                  fechaActualizacion: "2026-08-07T00:30:00.000Z"
                message: Comprobante de transferencia registrado correctamente

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          description: El pedido no existe o no pertenece al cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 404
                error: ORDER_NOT_FOUND
                message: El pedido solicitado no existe
                path: /api/v1/pedidos/cm123pedido456/comprobante-transferencia
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "409":
          description: El pedido ya tiene un código de transferencia registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 409
                error: TRANSFER_RECEIPT_ALREADY_REGISTERED
                message: El pedido ya tiene un comprobante de transferencia registrado
                path: /api/v1/pedidos/cm123pedido456/comprobante-transferencia
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

        "422":
          description: El pedido no admite el registro del comprobante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              examples:
                metodoInvalido:
                  summary: El pedido no utiliza transferencia
                  value:
                    statusCode: 422
                    error: PAYMENT_METHOD_NOT_TRANSFER
                    message: El pedido no utiliza transferencia como método de pago
                    path: /api/v1/pedidos/cm123pedido456/comprobante-transferencia
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

                ventanaExpirada:
                  summary: Ventana de pago expirada
                  value:
                    statusCode: 422
                    error: PAYMENT_WINDOW_EXPIRED
                    message: El tiempo permitido para registrar el pago ha expirado
                    path: /api/v1/pedidos/cm123pedido456/comprobante-transferencia
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

                estadoInvalido:
                  summary: Estado incompatible
                  value:
                    statusCode: 422
                    error: INVALID_ORDER_STATE
                    message: El pedido no se encuentra pendiente de pago
                    path: /api/v1/pedidos/cm123pedido456/comprobante-transferencia
                    timestamp: "2026-08-07T00:15:00.000Z"
                    requestId: req_123example456

        "500":
          $ref: "#/components/responses/InternalServerError"


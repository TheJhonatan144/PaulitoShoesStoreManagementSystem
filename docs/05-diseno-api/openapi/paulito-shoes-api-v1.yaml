  /api/v1/checkout/confirmar:
    post:
      tags:
        - Checkout
      summary: Confirmar el checkout y crear el pedido
      description: |
        Recalcula los precios, valida nuevamente el stock y crea el pedido.

        Si el método de pago es transferencia, el pedido se crea en estado
        pendientePago y no modifica el inventario.

        Si el método de pago es contraEntrega, el pedido se crea en estado
        reservado y la reserva descuenta inmediatamente el stock disponible.

        El cliente no envía subtotal, costo de envío ni total como valores
        definitivos. Todos los importes son calculados por el backend.
      operationId: confirmarCheckout
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            example:
              metodoPago: transferencia
              tipoEntrega: domicilio

      responses:
        "201":
          description: Pedido creado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaConfirmacionCheckout"
              examples:
                transferencia:
                  summary: Pedido mediante transferencia
                  value:
                    data:
                      pedidoId: cm123pedido456
                      numeroPedido: PS-2026-000001
                      estado: pendientePago
                      metodoPago: transferencia
                      tipoEntrega: domicilio
                      subtotal: 99.98
                      costoEnvio: 3.00
                      total: 102.98
                      moneda: USD
                      creadoEn: "2026-08-07T00:15:00.000Z"
                    message: Pedido creado correctamente

                contraEntrega:
                  summary: Pedido mediante contraentrega
                  value:
                    data:
                      pedidoId: cm789pedido012
                      numeroPedido: PS-2026-000002
                      estado: reservado
                      metodoPago: contraEntrega
                      tipoEntrega: domicilio
                      subtotal: 99.98
                      costoEnvio: 3.00
                      total: 102.98
                      moneda: USD
                      creadoEn: "2026-08-07T00:15:00.000Z"
                    message: Pedido creado y stock reservado correctamente

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "409":
          description: Conflicto con la clave de idempotencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 409

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarEstadoPedidoRequest"
            example:
              estado: preparado
              nota: Pedido preparado para despacho

      responses:
        "200":
          description: Estado actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaPedidoDetalleMensaje"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "403":
          $ref: "#/components/responses/Forbidden"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          description: La transición de estado solicitada no es válida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaError"
              example:
                statusCode: 422
                error: INVALID_ORDER_TRANSITION
                message: La transición de estado solicitada no está permitida
                path: /api/v1/admin/pedidos/cm123pedido456/estado
                timestamp: "2026-08-07T00:15:00.000Z"
                requestId: req_123example456

